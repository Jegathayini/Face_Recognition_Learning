<!DOCTYPE html>
<html>

<head>
    <title>Add Employee</title>
</head>

<body>

    <h1>Add Employee</h1>

    <form
        action="/add_employee"
        method="POST"
      <input
            type="text"
            name="name"
            required>

        <br><br>

        <label>Photo</label>
        <br>

        <input
            type="file"
            name="image"
            accept="image/*"
            required>

        <br><br>

        <button type="submit">
            Add Employee
        </button>

    </form>

</body>

</html>
